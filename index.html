<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CSE Roadmap</title>
  <meta name="description" content="Personal CSE engineering learning roadmap (1,029 sessions), offline-first.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css?v=6">
  <link rel="stylesheet" href="css/cur.css?v=7">
</head>
<body>
  <header class="topbar">
    <h1 id="screen-title">Home</h1>
    <a class="icon-btn" id="settings-link" href="#settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
    </a>
  </header>

  <main id="main" tabindex="-1">

    <section class="screen" id="screen-today" data-title="Home">
      <div id="today-card" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-calendar" data-title="Calendar" hidden>
      <div id="calendar" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-questions" data-title="Questions" hidden>
      <div id="questions-root" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-projects" data-title="Projects" hidden>
      <div id="projects-root" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-progress" data-title="Progress" hidden>
      <div id="progress-root" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-settings" data-title="Settings" hidden>
      <div id="settings-root" class="cur"></div>
    </section>

  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/></svg>
      <span>Home</span>
    </a>
    <a href="#calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Calendar</span>
    </a>
    <a href="#questions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      <span>Questions</span>
    </a>
    <a href="#projects">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>Projects</span>
    </a>
    <a href="#progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <span>Progress</span>
    </a>
  </nav>


  <script src="js/util.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
  <script src="js/data.js?v=7"></script>
  <script src="js/store.js?v=7"></script>
  <script src="js/state.js?v=7"></script>
  <script src="js/sessionview.js?v=7"></script>
  <script src="js/history.js?v=7"></script>
  <script src="js/home.js?v=7"></script>
  <script src="js/navigator.js?v=7"></script>
  <script src="js/progress.js?v=7"></script>
  <script src="js/projects.js?v=7"></script>
  <script src="js/questions.js?v=7"></script>
  <script src="js/settings.js?v=7"></script>
</body>
</html>
