<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bytewise</title>
  <meta name="description" content="Bytewise — Learn, Build, Progress. Personal CSE learning roadmap.">
  <meta name="theme-color" content="#050507">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="js/theme.js?v=5"></script>
  <link rel="stylesheet" href="css/styles.css?v=10">
  <link rel="stylesheet" href="css/theme.css?v=4">
  <link rel="stylesheet" href="css/cur.css?v=12">
  <link rel="stylesheet" href="css/home.css?v=4">
  <link rel="stylesheet" href="css/progress.css?v=3">
  <link rel="stylesheet" href="css/resources.css?v=3">
  <link rel="stylesheet" href="css/bytewise-ui.css?v=2">
  <link rel="stylesheet" href="css/calendar-plan.css?v=1">
  <link rel="stylesheet" href="css/reference.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="tb-title">
      <span class="tb-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6M3 22h18"/></svg></span>
      <div><h1 id="screen-title">Home</h1><p class="tb-sub" id="screen-sub">Track your learning journey</p></div>
    </div>
    <a class="icon-btn" id="settings-link" href="#settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
    </a>
  </header>

  <main id="main" tabindex="-1">

    <section class="screen" id="screen-today" data-title="Home">
      <div class="home-workspace-tabs" role="tablist" aria-label="Home learning areas">
        <button type="button" class="home-workspace-tab is-active" role="tab" aria-selected="true" data-home-tab="roadmap">Roadmap</button>
        <button type="button" class="home-workspace-tab" role="tab" aria-selected="false" data-home-tab="modules">Modules</button>
        <button type="button" class="home-workspace-tab" role="tab" aria-selected="false" data-home-tab="projects">Projects</button>
      </div>
      <div class="home-workspace-panel" data-home-panel="roadmap">
        <div id="today-card" class="cur"><p class="empty">Loading…</p></div>
      </div>
      <div class="home-workspace-panel" data-home-panel="modules" hidden>
        <div id="modules-root" class="cur"><p class="empty">Loading…</p></div>
      </div>
      <div class="home-workspace-panel" data-home-panel="projects" hidden>
        <div id="projects-root" class="cur"><p class="empty">Loading…</p></div>
      </div>
    </section>

    <section class="screen" id="screen-calendar" data-title="Calendar" hidden>
      <div id="calendar" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-questions" data-title="Questions" hidden>
      <div id="questions-root" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-progress" data-title="Progress" hidden>
      <div id="progress-root" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-resources" data-title="Resources" hidden>
      <div id="resources-root" class="cur"><p class="empty">Loading…</p></div>
    </section>

    <section class="screen" id="screen-settings" data-title="Settings" hidden>
      <div id="settings-root" class="cur"></div>
    </section>

  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/></svg>
      <span>Home</span>
    </a>
    <a href="#calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Calendar</span>
    </a>
    <a href="#questions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      <span>Questions</span>
    </a>
    <a href="#progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <span>Progress</span>
    </a>
    <a href="#resources">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Resources</span>
    </a>
  </nav>


  <script src="js/native.js?v=3"></script>
  <script src="js/util.js?v=10"></script>
  <script src="js/icons.js?v=3"></script>
  <script src="js/app.js?v=13"></script>
  <script src="js/data.js?v=11"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/state.js?v=11"></script>
  <script src="js/sessionview.js?v=9"></script>
  <script src="js/history.js?v=8"></script>
  <script src="js/gestures.js?v=2"></script>
  <script src="js/deck.js?v=1"></script>
  <script src="js/home.js?v=11"></script>
  <script src="js/navigator.js?v=9"></script>
  <script src="js/progress.js?v=11"></script>
  <script src="js/projects.js?v=12"></script>
  <script src="js/questions.js?v=12"></script>
  <script src="js/resources.js?v=3"></script>
  <script src="js/notify.js?v=1"></script>
  <script src="js/settings.js?v=14"></script>
  <script src="js/widgets.js?v=2"></script>
  <script src="js/home-tabs.js?v=1"></script>
  <script src="js/workspace.js?v=4"></script>
</body>
</html>
